---
# Collections used by this repo.
#
# hashicorp.terraform is a Red Hat *Partner Collection* — it lives on
# Red Hat Automation Hub, NOT on the public Ansible Galaxy. The default
# install path in this repo is the PRIVATE Automation Hub bundled with
# AAP 2.6 (synced from Red Hat Cloud into the rh-certified repository).
#
#   LOCAL CLI: ansible.cfg in the repo root configures the `rh_certified`
#              Galaxy server pointing at your Private Hub. You must add
#              your Hub token (see comments in ansible.cfg). Then:
#                ansible-galaxy collection install -r collections/requirements.yml
#
#   AAP:       Attach an "Ansible Galaxy/Automation Hub API Token"
#              Credential to the Project, with the URL set to your
#              Private Hub's rh-certified repo. AAP processes this file
#              at Project-sync time using that credential. See
#              docs/02-aap-integration.md Step 3.
#
#   ALT (SaaS): If you don't have a Private Hub, install from
#              console.redhat.com — see the commented `console_rh` block
#              at the bottom of ansible.cfg.
#
# Bump the version below when 2.1.0 ships and re-sync the AAP Project.
#
# RUNTIME OVERRIDE (test a pre-release branch without re-syncing the Project):
#   Pass `-e collection_git_ref=<branch-or-tag>` (and optionally
#   `-e collection_git_url=git+ssh://...`). The bootstrap playbook will
#   `ansible-galaxy collection install git+<url>,<ref> --force` into
#   ./collections, shadowing whatever the Project sync placed there. See
#   docs/04-overriding-collection-from-git.md.

collections:
  # Temporarily installing from next-2.1.0 branch for feature testing.
  # Revert to Hub source + pinned version when 2.1.0 is released:
  #   version: "2.1.0"
  #   source: https://ec2-44-199-30-193.compute-1.amazonaws.com/api/galaxy/content/rh-certified/
  - name: hashicorp.terraform
    type: git
    source: https://github.com/hashicorp/terraform-ansible-collection.git
    version: next-2.1.0

  # Public-Galaxy supporting collections — ansible-galaxy will find these on
  # `galaxy_public` (second in the server_list). We can leave the source
  # implicit, but pinning it explicitly here keeps the requirements file
  # readable as documentation of intent.
  - name: ansible.utils
    source: https://galaxy.ansible.com

  - name: community.general
    source: https://galaxy.ansible.com
