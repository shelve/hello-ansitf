---
# Dynamic inventory built from a workspace's *outputs* (not its state).
# Lighter weight than the statefile source and ideal when your Terraform
# config explicitly publishes "things Ansible should configure" as outputs.
#
# Suggested Terraform output shape (object spread becomes host_vars):
#
#   output "ansible_host" {
#     value = {
#       for n, i in aws_instance.app : n => {
#         public_ip = i.public_ip
#         env       = i.tags.Environment
#         role      = i.tags.Role
#       }
#     }
#   }
#
# The plugin treats a map(object) output as one host per map key, and spreads
# the user dict flat at the top level of host_vars.

plugin: hashicorp.terraform.tfc_inv
source: outputs

organization: my-tfc-org
workspace: aap-demo-app

# Optional: target named outputs other than the default `ansible_host`.
# Each entry needs `output:` (the Terraform output name) and optionally
# `type:` (a Terraform type expression — see plugin docs).
hosts_from:
  - output: ansible_host
    type: map(object)

# constructed options work as usual — the spread fields are referenced
# directly by their key name.
compose:
  ansible_host: public_ip
keyed_groups:
  - key: env
    prefix: env
  - key: role
    prefix: role
