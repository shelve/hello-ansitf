---
# playbooks/11_e2e_aws_inventory_demo_ee.yml
#
# EE-focused E2E demo:
#   1) create/update workspace
#   2) upload AWS Terraform config
#   3) plan + apply
#   4) expose IDs for downstream workflow nodes
#
# This playbook assumes pytfe is already baked into the custom EE.

- name: E2E AWS demo - workspace to applied run (custom EE)
  hosts: localhost
  gather_facts: false
  connection: local
  collections:
    - hashicorp.terraform

  vars:
    common_auth: &auth
      tfe_token: "{{ lookup('env', 'TFE_TOKEN') }}"

  tasks:
    - name: Assert new_workspace was provided
      ansible.builtin.fail:
        msg: "Pass `-e new_workspace=<name>` (or fill the survey field)."
      when: new_workspace is not defined or (new_workspace | length == 0)

    - name: Resolve target project
      hashicorp.terraform.project_info:
        project_id: "{{ tfc_project_id_default }}"
        <<: *auth
      register: proj

    - name: Create or update workspace shell
      hashicorp.terraform.workspace:
        organization: "{{ tfc_organization }}"
        workspace: "{{ new_workspace }}"
        project_id: "{{ proj.project.id }}"
        description: "AAP integrated EE demo workspace"
        terraform_version: "1.9.5"
        execution_mode: remote
        auto_apply: false
        allow_destroy_plan: true
        state: present
        <<: *auth
      register: ws

    - name: Read workspace details to get deterministic workspace id
      hashicorp.terraform.workspace_info:
        organization: "{{ tfc_organization }}"
        workspace: "{{ new_workspace }}"
        <<: *auth
      register: ws_info

    - name: Normalize workspace id from module response
      ansible.builtin.set_fact:
        tfc_workspace_id: "{{ ws_info.workspace.id if (ws_info.workspace is defined and ws_info.workspace.id is defined) else '' }}"

    - name: Assert workspace id resolved
      ansible.builtin.assert:
        that:
          - tfc_workspace_id | length > 0
        fail_msg: "Unable to resolve workspace id from workspace module response."

    - name: Set terraform variables for demo workspace
      hashicorp.terraform.variable:
        workspace_id: "{{ tfc_workspace_id }}"
        key: "{{ item.key }}"
        value: "{{ item.value }}"
        category: terraform
        state: present
        <<: *auth
      loop:
        - { key: region, value: "{{ region | default('us-east-1') }}" }
        - { key: environment, value: "{{ environment_tag | default('demo') }}" }
        - { key: app_name, value: "{{ app_name | default('aap-demo-app') }}" }
        - { key: instance_type, value: "{{ instance_type | default('t3.micro') }}" }
        - { key: ssh_ingress_cidr, value: "{{ ssh_ingress_cidr | default('0.0.0.0/0') }}" }
      loop_control:
        label: "{{ item.key }}={{ item.value }}"

    - name: Upload Terraform config (AWS EC2 demo)
      hashicorp.terraform.configuration_version:
        workspace_id: "{{ tfc_workspace_id }}"
        configuration_files_path: "{{ tf_config_dir | default(playbook_dir ~ '/../files/aws_ec2_demo_config') }}"
        auto_queue_runs: false
        state: present
        <<: *auth
      register: cv

    - name: Normalize configuration version id from module response
      ansible.builtin.set_fact:
        tfc_configuration_version_id: "{{ cv.id if cv.id is defined else '' }}"

    - name: Assert configuration version id resolved
      ansible.builtin.assert:
        that:
          - tfc_configuration_version_id | length > 0
        fail_msg: "Unable to resolve configuration version id from configuration_version module response."

    - name: Create run (plan)
      hashicorp.terraform.run:
        workspace_id: "{{ tfc_workspace_id }}"
        configuration_version: "{{ tfc_configuration_version_id }}"
        run_message: "AAP integrated EE demo"
        poll: true
        poll_interval: "{{ run_poll_interval_seconds }}"
        poll_timeout: "{{ run_poll_timeout_seconds }}"
        state: "present"
        <<: *auth
      register: planned

    - name: Normalize run id and status from run module response
      ansible.builtin.set_fact: 
        tfc_run_id: "{{ planned.id }}"
        tfc_run_status: "{{ planned.status }}"
        tfc_run_has_changes: "{{ planned.has_changes }}"
      when: planned is defined

    - name: Assert run id resolved
      ansible.builtin.assert:
        that:
          - tfc_run_id | length > 0
        fail_msg: "Unable to resolve run id from run module response."

    - name: Apply run
      hashicorp.terraform.run:
        run_id: "{{ tfc_run_id }}"
        state: applied
        poll: true
        poll_interval: "{{ run_poll_interval_seconds }}"
        poll_timeout: "{{ run_poll_timeout_seconds }}"
        <<: *auth
      when:
        - tfc_run_status in ['planned', 'planned_and_finished', 'post_plan_completed', 'cost_estimated', 'policy_checked', 'confirmed']
        - tfc_run_has_changes | bool
      register: applied

    - name: Read outputs
      hashicorp.terraform.output:
        workspace_id: "{{ tfc_workspace_id }}"
        display_sensitive: false
        <<: *auth
      register: outs

    - name: Normalize key outputs from output module response
      ansible.builtin.set_fact:
        tfc_instance_id: "{{ (outs.outputs | selectattr('name', 'equalto', 'instance_id') | map(attribute='value') | list | first) | default('n/a') }}"
        tfc_public_ip: "{{ (outs.outputs | selectattr('name', 'equalto', 'public_ip') | map(attribute='value') | list | first) | default('n/a') }}"

    - name: Show key outputs for operators
      ansible.builtin.debug:
        msg:
          - "workspace={{ new_workspace }}"
          - "run_id={{ tfc_run_id }}"
          - "instance_id={{ tfc_instance_id }}"
          - "public_ip={{ tfc_public_ip }}"

    - name: Expose workflow variables to downstream nodes
      ansible.builtin.set_stats:
        data:
          tfc_workspace: "{{ new_workspace }}"
          tfc_workspace_id: "{{ tfc_workspace_id }}"
          tfc_run_id: "{{ tfc_run_id }}"
          tfc_configuration_version_id: "{{ tfc_configuration_version_id }}"
          demo_env_group: "env_{{ environment_tag | default('demo') }}"
          demo_role_group: "role_web"
