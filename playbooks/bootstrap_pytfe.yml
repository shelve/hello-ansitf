---
# bootstrap_pytfe.yml

- name: Bootstrap pytfe into the execution environment
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Skip if operator has disabled runtime pytfe install
      ansible.builtin.meta: end_play
      when: not (install_pytfe_at_runtime | default(true) | bool)

    - name: Install pytfe via pip into the EE's Python
      # ansible.builtin.pip uses {{ ansible_python_interpreter }} by default,
      # which on AAP resolves to the EE's bundled Python — exactly where the
      # collection's modules will look for pytfe at import time.
      ansible.builtin.pip:
        name: "pytfe{{ pytfe_version | default('>=0.1.5') }}"
        state: present
        extra_args: "{{ pytfe_pip_extra_args | default('') }}"
      register: pytfe_install

    - name: Show pytfe install result
      ansible.builtin.debug:
        msg: "pytfe install: {{ pytfe_install.stdout_lines | default([pytfe_install.msg | default('already present')]) }}"
