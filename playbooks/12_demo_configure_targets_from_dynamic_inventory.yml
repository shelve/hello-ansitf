---
# playbooks/12_demo_configure_targets_from_dynamic_inventory.yml
#
# Runs after inventory source sync in AAP workflow.
# Targets hosts discovered by tfc_inv (outputs source) grouped by env + role.

- name: Inventory sanity for dynamic hosts
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Show groups generated by inventory plugin
      ansible.builtin.debug:
        var: groups

- name: Configure demo web targets from Terraform inventory
  hosts: "{{ target_hosts | default('env_demo:&role_web') }}"
  gather_facts: true
  become: true
  tasks:
    - name: Ensure nginx is installed
      ansible.builtin.package:
        name: nginx
        state: present

    - name: Ensure nginx is enabled and running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Publish marker proving dynamic inventory handoff worked
      ansible.builtin.copy:
        dest: /etc/aap-demo-marker
        content: "Configured via AAP dynamic inventory at {{ ansible_date_time.iso8601 }}\n"
        mode: "0644"
