---
# playbooks/08_rotate_secrets.yml
#
# WORKFLOW: "rotate workspace secrets" — push new sensitive variable values
# across a set of workspaces. Designed to be run on a schedule from AAP, or
# triggered by an upstream secret-management system (Vault, AWS Secrets
# Manager, etc.) via a webhook.

- name: Bootstrap pytfe (no-op if already present)
  import_playbook: bootstrap_pytfe.yml

- name: Rotate sensitive workspace variables
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    # AAP survey or upstream system fills these in.
    workspaces_to_rotate:
      - "{{ tfc_workspace }}"
    secret_updates:
      - { key: AWS_ACCESS_KEY_ID,     value: "{{ aws_access_key_id }}",     category: env }
      - { key: AWS_SECRET_ACCESS_KEY, value: "{{ aws_secret_access_key }}", category: env }
  tasks:
    - name: Push each secret into each workspace
      hashicorp.terraform.variable:
        organization: "{{ tfc_organization }}"
        workspace: "{{ item.0 }}"
        key: "{{ item.1.key }}"
        value: "{{ item.1.value }}"
        category: "{{ item.1.category }}"
        sensitive: true
        description: "Rotated by AAP at {{ ansible_date_time.iso8601 }}"
        state: present
        tfe_token: "{{ lookup('env', 'TFE_TOKEN') }}"
      loop: "{{ workspaces_to_rotate | product(secret_updates) | list }}"
      loop_control:
        label: "{{ item.0 }} → {{ item.1.key }}"
