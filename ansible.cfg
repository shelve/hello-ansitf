[defaults]
# Where collections installed by `ansible-galaxy collection install -r collections/requirements.yml`
# get unpacked. AAP also reads collections from this path when it lives at the
# project root.
collections_path = ./collections

# Default inventory used when --inventory is not passed. Override on the CLI or
# in AAP by selecting a different inventory.
inventory = ./inventories/sample/inventory.yml

# Roles checked out alongside the playbooks.
roles_path = ./roles

# Make plays self-documenting in stdout.
stdout_callback = yaml
bin_ansible_callbacks = True

# Suppress the cowsay banner when ansible-playbook runs.
nocows = 1

# Make Ansible warn loudly when a task references a host that the inventory
# does not yet know about — useful when iterating on dynamic inventory.
host_key_checking = False
retry_files_enabled = False

[inventory]
# Dynamic inventory plugins shipped by hashicorp.terraform that this repo uses.
enable_plugins = hashicorp.terraform.tfc_inv, constructed, auto, yaml, ini

[ssh_connection]
# Reasonable defaults for cloud SSH targets created via the dynamic inventory.
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

# ---------------------------------------------------------------------------
# Galaxy / Automation Hub
# ---------------------------------------------------------------------------
# hashicorp.terraform is a Red Hat *Partner Collection*. It is NOT on the
# public Ansible Galaxy. The two ways customers consume it are:
#
#   (A) PRIVATE AUTOMATION HUB shipped with AAP (the typical AAP 2.6 setup).
#       The collection is synced from Red Hat Cloud into the Hub's
#       `rh-certified` repository, then served from your own AAP install.
#       This is the configuration the rest of the repo assumes.
#
#   (B) RED HAT CLOUD SaaS Automation Hub (console.redhat.com).
#       Different URL, different auth flow (offline token + SSO auth_url).
#       Block left commented below for forks that prefer the SaaS path.
#
# Get a token for option (A) — Private Hub:
#   <hub-url>/ui/  → log in → "Collections" → "API token" (or "User Access"
#   → "API Token" depending on AAP version) → "Load token". The token is
#   shown ONCE — copy it immediately.
#
# Do NOT commit a real token. Either:
#   (a) edit this file locally and never commit the change, OR
#   (b) move the [galaxy_server.*] block to ~/.ansible.cfg (user-level), OR
#   (c) export ANSIBLE_GALAXY_SERVER_RH_CERTIFIED_TOKEN at the shell.
#
# AAP itself does NOT read this section — the Controller uses its own
# "Ansible Galaxy / Automation Hub API Token" Credential type, attached to
# the Project (see docs/02-aap-integration.md).
#
# SELF-SIGNED CERT NOTE: Lab AAP installs commonly use a self-signed
# certificate (e.g. ec2-…amazonaws.com hostnames). If ansible-galaxy fails
# with `certificate verify failed`, EITHER:
#   * preferred: export the Hub CA into your system trust store, OR
#   * bypass with `ansible-galaxy collection install -r … --ignore-certs`,
#     or set env `ANSIBLE_GALAXY_IGNORE_CERTS=1`.
# Per-server `validate_certs = false` is supported in newer ansible-core
# but not universally; the env-var route is the safest.

[galaxy]
server_list = rh_certified, galaxy_public, published, staging

# --- (A) Private AAP Automation Hub — rh-certified repo (active) ----------
[galaxy_server.rh_certified]
url = https://ec2-44-199-30-193.compute-1.amazonaws.com/api/galaxy/content/rh-certified/
# Bearer token issued by the Private Hub UI. Override with
# ANSIBLE_GALAXY_SERVER_RH_CERTIFIED_TOKEN in the environment.
#token = <put your private hub token here>
# auth_url is NOT needed for a Private Hub token (it's a direct bearer
# token, not an SSO offline token). If your Hub is wired to a Keycloak SSO
# realm and issues offline tokens, uncomment and adjust:
# auth_url = https://<hub-host>/auth/realms/<realm>/protocol/openid-connect/token

# --- Public Ansible Galaxy fallback for ansible.utils / community.general ---
# Anonymous reads are fine; no token field needed.
[galaxy_server.galaxy_public]
url = https://galaxy.ansible.com/api/

# --- (B) Red Hat Cloud SaaS Automation Hub (alternative, commented) -------
# If you DON'T have a Private Hub and want to install directly from
# console.redhat.com, comment the [galaxy] server_list line above and
# uncomment the next three lines:
#
# [galaxy]
# server_list = console_rh
#
# [galaxy_server.console_rh]
# url = https://console.redhat.com/api/automation-hub/content/published/
# token = <offline token from console.redhat.com>
# auth_url = https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
