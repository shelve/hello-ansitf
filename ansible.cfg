[defaults]
# Where collections installed by `ansible-galaxy collection install -r collections/requirements.yml`
# get unpacked. AAP also reads collections from this path when it lives at the
# project root.
collections_path = ./collections

# Default inventory used when --inventory is not passed. Override on the CLI or
# in AAP by selecting a different inventory.
inventory = ./inventories/sample/inventory.yml

# Roles checked out alongside the playbooks.
roles_path = ./roles

# Make plays self-documenting in stdout.
stdout_callback = yaml
bin_ansible_callbacks = True

# Suppress the cowsay banner when ansible-playbook runs.
nocows = 1

# Make Ansible warn loudly when a task references a host that the inventory
# does not yet know about — useful when iterating on dynamic inventory.
host_key_checking = False
retry_files_enabled = False

[inventory]
# Dynamic inventory plugins shipped by hashicorp.terraform that this repo uses.
enable_plugins = hashicorp.terraform.tfc_inv, constructed, auto, yaml, ini

[ssh_connection]
# Reasonable defaults for cloud SSH targets created via the dynamic inventory.
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

# ---------------------------------------------------------------------------
# Galaxy / Automation Hub
# ---------------------------------------------------------------------------
# hashicorp.terraform is a Red Hat *Partner Collection* — it is NOT on the
# public Ansible Galaxy. It is published to Red Hat Automation Hub. So local
# CLI users need ansible-galaxy pointed at the Hub, and the Hub needs an
# offline token.
#
# Get a token:
#   console.redhat.com → Automation Hub → "Connect to Hub" → "Load token"
#
# Do NOT commit a real token. Either:
#   (a) edit this file locally and never commit the change, OR
#   (b) move the [galaxy_server.published] block to your user-level
#       ~/.ansible.cfg (highest precedence after env vars), OR
#   (c) export ANSIBLE_GALAXY_SERVER_PUBLISHED_TOKEN at the shell.
#
# AAP itself does NOT read this section — the Controller uses its own
# "Ansible Galaxy / Automation Hub API Token" Credential type, attached to
# the Project (see docs/02-aap-integration.md).
[galaxy]
server_list = published

[galaxy_server.published]
# Use the path the user originally provided. Red Hat's canonical paths are:
#   Certified content:  https://console.redhat.com/api/automation-hub/content/published/
#   Validated content:  https://console.redhat.com/api/automation-hub/content/validated/
url = https://console.redhat.com/api/automation-hub/
# Offline token from console.redhat.com. Replace at install time or set
# ANSIBLE_GALAXY_SERVER_PUBLISHED_TOKEN in the env to override.
token = <put your token here>
# Required for Automation Hub: the offline token is exchanged for a
# short-lived access token at this URL.
auth_url = https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
